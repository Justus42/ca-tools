name: Site

on:
  workflow_run:
    workflows: ["Table page"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/*.py
            /table/*.csv
            /table/*.py
            /docs/llms.txt
            /docs/derived.html
      - name: Add the small arrays shown on array pages
        run: python3 tools/build_site.py --repo . --out _site --sparse-list | git sparse-checkout add --stdin
      - name: Build the site from the table on main
        run: python3 tools/build_site.py --repo . --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
